name: UI and API Automation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: API Tests
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      executed: ${{ steps.api-summary.outputs.executed }}
      passed: ${{ steps.api-summary.outputs.passed }}
      failed: ${{ steps.api-summary.outputs.failed }}
      skipped: ${{ steps.api-summary.outputs.skipped }}
      duration_ms: ${{ steps.api-summary.outputs.duration_ms }}
    env:
      ENV: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'PRD' || 'STG' }}
      HEAD: true
      BROWSER: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run API suite
        run: npm run test:all -- --tags "@api"

      - name: API execution summary
        id: api-summary
        if: always()
        shell: pwsh
        run: |
          $reportPath = "test-results/cucumber-report.json"

          $executed = 0
          $passed = 0
          $failed = 0
          $skipped = 0
          $durationMs = 0

          if (Test-Path $reportPath) {
            $report = Get-Content -Path $reportPath -Raw | ConvertFrom-Json
            foreach ($feature in $report) {
              foreach ($scenario in $feature.elements) {
                if (-not $scenario) { continue }
                $executed++

                $scenarioStatuses = @()
                foreach ($step in $scenario.steps) {
                  if ($step.result -and $step.result.status) { $scenarioStatuses += $step.result.status }
                  if ($step.result -and $step.result.duration) { $durationMs += [int64]($step.result.duration / 1000000) }
                }

                if ($scenarioStatuses -contains "failed") { $failed++ }
                elseif ($scenarioStatuses -contains "passed") { $passed++ }
                else { $skipped++ }
              }
            }
          }

          @"
          executed=$executed
          passed=$passed
          failed=$failed
          skipped=$skipped
          duration_ms=$durationMs
          "@ | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## API Suite Report"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Metric | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---|---:|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Executed | $executed |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Passed | $passed |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Failed | $failed |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Skipped | $skipped |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Duration (ms) | $durationMs |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Job Result | ${{ job.status }} |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Branch | ${{ github.ref_name }} |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Environment | ${{ env.ENV }} |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"

      - name: Upload API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          path: |
            test-results/cucumber-report.html
            test-results/cucumber-report.json
            test-results/reports/**
            allure-results/**
          if-no-files-found: warn

  ui-tests:
    name: UI Tests
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      executed: ${{ steps.ui-summary.outputs.executed }}
      passed: ${{ steps.ui-summary.outputs.passed }}
      failed: ${{ steps.ui-summary.outputs.failed }}
      skipped: ${{ steps.ui-summary.outputs.skipped }}
      duration_ms: ${{ steps.ui-summary.outputs.duration_ms }}
    env:
      ENV: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'PRD' || 'STG' }}
      HEAD: true
      BROWSER: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run UI suite
        run: npm run test:all -- --tags "not @api"

      - name: UI execution summary
        id: ui-summary
        if: always()
        shell: pwsh
        run: |
          $reportPath = "test-results/cucumber-report.json"

          $executed = 0
          $passed = 0
          $failed = 0
          $skipped = 0
          $durationMs = 0

          if (Test-Path $reportPath) {
            $report = Get-Content -Path $reportPath -Raw | ConvertFrom-Json
            foreach ($feature in $report) {
              foreach ($scenario in $feature.elements) {
                if (-not $scenario) { continue }
                $executed++

                $scenarioStatuses = @()
                foreach ($step in $scenario.steps) {
                  if ($step.result -and $step.result.status) { $scenarioStatuses += $step.result.status }
                  if ($step.result -and $step.result.duration) { $durationMs += [int64]($step.result.duration / 1000000) }
                }

                if ($scenarioStatuses -contains "failed") { $failed++ }
                elseif ($scenarioStatuses -contains "passed") { $passed++ }
                else { $skipped++ }
              }
            }
          }

          @"
          executed=$executed
          passed=$passed
          failed=$failed
          skipped=$skipped
          duration_ms=$durationMs
          "@ | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## UI Suite Report"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Metric | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---|---:|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Executed | $executed |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Passed | $passed |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Failed | $failed |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Skipped | $skipped |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Duration (ms) | $durationMs |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Job Result | ${{ job.status }} |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Branch | ${{ github.ref_name }} |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Environment | ${{ env.ENV }} |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Run URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            test-results/cucumber-report.html
            test-results/cucumber-report.json
            test-results/reports/**
            allure-results/**
          if-no-files-found: warn

  email-report:
    name: Email Report
    needs: [api-tests, ui-tests]
    runs-on: windows-latest
    if: always()
    steps:
      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-test-artifacts
          path: artifacts/api

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-test-artifacts
          path: artifacts/ui

      - name: Send execution summary email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: >-
            QA Automation CI (${{ github.ref_name }}) - API: ${{ needs.api-tests.result }}, UI: ${{ needs.ui-tests.result }}
          to: ${{ secrets.QA_REPORT_TO_EMAIL }}
          from: ${{ secrets.QA_REPORT_FROM_EMAIL }}
          html_body: |
            <div style="font-family: Arial, sans-serif; line-height: 1.5; color: #111827;">
              <h2 style="margin: 0 0 12px 0;">QA Automation Execution Summary</h2>

              <p style="margin: 4px 0;">
                <strong>Overall Result:</strong>
                <span style="color: ${{ (needs.api-tests.result == 'success' && needs.ui-tests.result == 'success') && '#15803d' || '#dc2626' }}; font-weight: 700;">
                  ${{ (needs.api-tests.result == 'success' && needs.ui-tests.result == 'success') && 'SUCCESS' || 'FAILURE' }}
                </span>
              </p>
              <p style="margin: 4px 0;"><strong>Workflow:</strong> ${{ github.workflow }}</p>
              <p style="margin: 4px 0;"><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p style="margin: 4px 0;"><strong>Environment:</strong> ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'PRD' || 'STG' }}</p>

              <p style="margin: 12px 0 4px 0;"><strong>API Job Result:</strong>
                <span style="color: ${{ needs.api-tests.result == 'success' && '#15803d' || '#dc2626' }}; font-weight: 700;">
                  ${{ needs.api-tests.result == 'success' && 'PASS' || needs.api-tests.result }}
                </span>
              </p>
              <p style="margin: 4px 0;"><strong>API Executed:</strong> ${{ needs.api-tests.outputs.executed }}</p>
              <p style="margin: 4px 0;"><strong>API Passed:</strong> <span style="color: #15803d; font-weight: 700;">${{ needs.api-tests.outputs.passed }}</span></p>
              <p style="margin: 4px 0;"><strong>API Failed:</strong> <span style="color: #dc2626; font-weight: 700;">${{ needs.api-tests.outputs.failed }}</span></p>
              <p style="margin: 4px 0;"><strong>API Skipped:</strong> <span style="color: #2563eb; font-weight: 700;">${{ needs.api-tests.outputs.skipped }}</span></p>
              <p style="margin: 4px 0;"><strong>API Duration (ms):</strong> ${{ needs.api-tests.outputs.duration_ms }}</p>

              <p style="margin: 12px 0 4px 0;"><strong>UI Job Result:</strong>
                <span style="color: ${{ needs.ui-tests.result == 'success' && '#15803d' || '#dc2626' }}; font-weight: 700;">
                  ${{ needs.ui-tests.result == 'success' && 'PASS' || needs.ui-tests.result }}
                </span>
              </p>
              <p style="margin: 4px 0;"><strong>UI Executed:</strong> ${{ needs.ui-tests.outputs.executed }}</p>
              <p style="margin: 4px 0;"><strong>UI Passed:</strong> <span style="color: #15803d; font-weight: 700;">${{ needs.ui-tests.outputs.passed }}</span></p>
              <p style="margin: 4px 0;"><strong>UI Failed:</strong> <span style="color: #dc2626; font-weight: 700;">${{ needs.ui-tests.outputs.failed }}</span></p>
              <p style="margin: 4px 0;"><strong>UI Skipped:</strong> <span style="color: #2563eb; font-weight: 700;">${{ needs.ui-tests.outputs.skipped }}</span></p>
              <p style="margin: 4px 0;"><strong>UI Duration (ms):</strong> ${{ needs.ui-tests.outputs.duration_ms }}</p>

              <p style="margin: 12px 0 4px 0;"><strong>Run URL:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>
              <p style="margin: 4px 0;"><strong>Artifacts:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts</a></p>
            </div>
