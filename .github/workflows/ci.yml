name: UI and API Automation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ENV: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'PRD' || 'STG' }}
      HEAD: true
      BROWSER: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API suite
        run: npm run test:all -- --tags "@api"

      - name: Upload API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          path: |
            test-results/cucumber-report.html
            test-results/cucumber-report.json
            test-results/reports/**
            allure-results/**
          if-no-files-found: warn

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ENV: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'PRD' || 'STG' }}
      HEAD: true
      BROWSER: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI suite
        run: npm run test:all -- --tags "not @api"

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            test-results/cucumber-report.html
            test-results/cucumber-report.json
            test-results/reports/**
            allure-results/**
          if-no-files-found: warn

  email-report:
    name: Email Report
    needs: [api-tests, ui-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-test-artifacts
          path: artifacts/api

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-test-artifacts
          path: artifacts/ui

      - name: Send execution summary email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: >-
            QA Automation CI (${{ github.ref_name }}) - API: ${{ needs.api-tests.result }}, UI: ${{ needs.ui-tests.result }}
          to: ${{ secrets.QA_REPORT_TO_EMAIL }}
          from: ${{ secrets.QA_REPORT_FROM_EMAIL }}
          body: |
            QA Automation Execution Summary

            Overall Result: ${{ (needs.api-tests.result == 'success' && needs.ui-tests.result == 'success') && 'SUCCESS' || 'FAILURE' }}
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'PRD' || 'STG' }}
            API Job Result: ${{ needs.api-tests.result == 'success' && 'PASS' || needs.api-tests.result }}
            UI Job Result: ${{ needs.ui-tests.result == 'success' && 'PASS' || needs.ui-tests.result }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          attachments: artifacts/api/test-results/reports/index.html,artifacts/ui/test-results/reports/index.html
